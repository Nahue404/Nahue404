<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="800" height="24" preserveAspectRatio="none">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="24">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feGaussianBlur stdDeviation="5" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c58cff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#c58cff"/>
      <stop offset="0.85" stop-color="#c58cff"/>
      <stop offset="1" stop-color="#c58cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .zumbido { animation: zumbido 3s ease-in-out infinite; }
      @keyframes zumbido { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
    </style>
  </defs>
  <g class="zumbido">
    <rect x="40" y="11" width="720" height="2" rx="1" fill="url(#borde)" filter="url(#glow)"/>
  </g>
  <rect x="-160" y="11" width="160" height="2" fill="url(#brillo)">
    <animate attributeName="x" from="-160" to="800" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
